<rect x="98" y="522" width="220" height="116" rx="12" fill="#fff8f8" stroke="#f4d9dc"/><text x="208" y="553" text-anchor="middle" class="boxh">Identity &amp; Access</text><text x="208" y="579" text-anchor="middle" class="txt">JWT authentication</text><text x="208" y="601" text-anchor="middle" class="txt">role-based permissions</text>
