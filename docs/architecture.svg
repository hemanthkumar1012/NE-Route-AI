<rect x="96" y="798" width="32" height="30" rx="8" fill="#e8f7ef"/><text x="112" y="819" text-anchor="middle" font-size="16" fill="#259764">▦</text>
<text x="142" y="819" class="boxh">DATA LAYER</text><text x="470" y="819" text-anchor="end" class="pill" fill="#299569">POSTGRESQL · POSTGIS</text>
<text x="104" y="858" class="txt">• Users, roles and audit records</text><text x="104" y="883" class="txt">• Districts, road graph and incidents</text><text x="104" y="908" class="txt">• Vehicles, GPS history and shipments</text><text x="104" y="933" class="txt">• Predictions, routes and alerts</text>

<rect x="534" y="798" width="32" height="30" rx="8" fill="#f1edff"/><text x="550" y="819" text-anchor="middle" font-size="16" fill="#8065c6">✦</text>
<text x="580" y="819" class="boxh">AI / ML SERVICE</text><text x="908" y="819" text-anchor="end" class="pill" fill="#7b63ba">PYTHON · SCIKIT-LEARN</text>
<text x="542" y="858" class="txt">• Random Forest disruption risk inference</text><text x="542" y="883" class="txt">• Feature-driver explanations</text><text x="542" y="908" class="txt">• Batch predictions and model metadata</text><text x="542" y="933" class="txt">• Optional image model adapter (checkpoint required)</text>

<rect x="972" y="798" width="32" height="30" rx="8" fill="#f0f2f5"/><text x="988" y="819" text-anchor="middle" font-size="16" fill="#667386">↗</text>
<text x="1018" y="819" class="boxh">OPTIONAL INTEGRATIONS</text>
<text x="980" y="858" class="txt">• OpenStreetMap basemap / OSRM adapter</text><text x="980" y="883" class="txt">• Weather provider (not configured by default)</text><text x="980" y="908" class="txt">• LLM provider, optional API key</text><text x="980" y="933" class="txt">• Email / SMS / WhatsApp provider adapters</text>

<text x="720" y="1008" text-anchor="middle" class="small">Prototype outputs are synthetic unless a verified external source is explicitly connected · Human approval required for operational actions</text>
</svg>