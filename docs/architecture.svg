<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">NE-Route AI advanced system architecture</title>
<desc id="desc">React Leaflet command center connects by REST and WebSocket to FastAPI core APIs, routing and logistics services, digital twin, relief resource staging, incident fusion and a hash chained decision journal. The backend connects to PostgreSQL PostGIS, a Random Forest ML service, background processors and optional external integrations.</desc>
