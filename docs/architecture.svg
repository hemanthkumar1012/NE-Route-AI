<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">NE-Route AI system architecture</title>
<desc id="desc">React and Leaflet frontend connects through REST and WebSocket to FastAPI. FastAPI connects to PostgreSQL and PostGIS, a separate scikit-learn machine learning service, and optional integrations including OpenStreetMap, OSRM, weather, LLM and messaging providers. Background tasks simulate GPS, refresh risk, monitor shipment delays and synchronize offline reports.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafa"/><stop offset="1" stop-color="#fff1f2"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f15c65"/><stop offset="1" stop-color="#cf3542"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8b343d" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d85a63"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8993a3"/></marker>
  <style>
    .h{font:700 28px 'Arial',sans-serif;fill:#252b36}.sub{font:14px 'Arial',sans-serif;fill:#7c8492}.ey{font:700 12px 'Arial',sans-serif;letter-spacing:2px;fill:#b85b63}.boxh{font:700 19px 'Arial',sans-serif;fill:#293241}.txt{font:14px 'Arial',sans-serif;fill:#697384}.small{font:12px 'Arial',sans-serif;fill:#9098a5}.pill{font:700 11px 'Arial',sans-serif;letter-spacing:.8px}.white{fill:#fff}.line{stroke:#d85a63;stroke-width:3;fill:none;marker-end:url(#arrow)}.lineg{stroke:#8993a3;stroke-width:2.5;fill:none;marker-end:url(#arrowGray)}.dash{stroke-dasharray:7 7}
  </style>
</defs>
<rect width="1440" height="1040" rx="28" fill="url(#bg)"/>
<circle cx="1280" cy="105" r="170" fill="#f9d9dc" opacity=".25"/><circle cx="95" cy="900" r="210" fill="#f8dadd" opacity=".20"/>
<text x="72" y="72" class="ey">SYSTEM DESIGN / SIH 2026 · SIH26002</text>
<text x="72" y="116" class="h" font-size="36">NE-Route AI — System Architecture</text>
<text x="72" y="145" class="sub">Geospatial intelligence · disruption prediction · risk-aware logistics coordination</text>
<rect x="1120" y="73" width="244" height="42" rx="21" fill="#fff" stroke="#f0c8cc"/>
<circle cx="1144" cy="94" r="6" fill="#df444d"/><text x="1160" y="98" class="pill" fill="#b83f49">SIMULATED DEMO DATA</text>

